{% extends 'base.html' %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <i class="bi bi-pencil-square text-primary" style="font-size:70px;"></i>

                        <h2 class="fw-bold mt-3">
                            Edit Profile
                        </h2>

                        <p class="text-muted">
                            Update your account information
                        </p>

                    </div>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">
                                First Name
                            </label>

                            <input
                                type="text"
                                name="first_name"
                                class="form-control"
                                value="{{ user.first_name }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Last Name
                            </label>

                            <input
                                type="text"
                                name="last_name"
                                class="form-control"
                                value="{{ user.last_name }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                value="{{ user.email }}">
                        </div>

                        <div class="d-grid gap-2 mt-4">

                            <button class="btn btn-primary btn-lg">
                                💾 Save Changes
                            </button>

                            <a href="{% url 'profile' %}" class="btn btn-outline-secondary">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
